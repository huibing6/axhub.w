name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync vendor packages
        run: pnpm vendor:sync

      - name: Scan entries
        run: node scripts/scan-entries.js

      - name: Build sp2-workspace
        run: pnpm exec vite build --config vite.config.sp2.ts

      - name: Prepare dist-sp2
        run: |
          mkdir -p dist-sp2/sp2-workspace
          cp dist/prototypes/sp2-workspace/index.js dist-sp2/sp2-workspace/index.js
          cp -r dist/assets dist-sp2/assets
          cat > dist-sp2/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>云梦泽服务商工作台2.0</title>
            <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="./sp2-workspace/index.js"></script>
          </body>
          </html>
          EOF
          touch dist-sp2/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-sp2

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
