name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install

      - name: Vendor sync & scan entries
        run: pnpm vendor:sync && node scripts/scan-entries.js

      - name: Build prototypes (admin-workspace)
        run: npx vite build
        env:
          ENTRY_KEY: prototypes/admin-workspace

      - name: Build prototypes (sp-workspace)
        run: npx vite build
        env:
          ENTRY_KEY: prototypes/sp-workspace

      - name: Build prototypes (petroleum-portal)
        run: npx vite build
        env:
          ENTRY_KEY: prototypes/petroleum-portal

      - name: Build prototypes (site-inspection)
        run: npx vite build
        env:
          ENTRY_KEY: prototypes/site-inspection

      - name: Build prototypes (ref-app-home)
        run: npx vite build
        env:
          ENTRY_KEY: prototypes/ref-app-home

      - name: Generate static HTML for prototypes
        run: node scripts/generate-dist-html.js

      - name: Build sp2-workspace
        run: pnpm exec vite build --config vite.config.sp2.ts

      - name: Copy sp2 build to dist
        run: |
          mkdir -p dist/sp2-workspace
          cp dist-sp2/sp2-workspace/index.js dist/sp2-workspace/index.js
          mkdir -p dist/assets
          cp dist-sp2/assets/* dist/assets/

      - name: Create sp2-workspace index.html
        run: |
          cat > dist/sp2-workspace/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>服务商工作台 2.0</title>
            <link rel="stylesheet" href="../assets/index-CFNAmtfU.css" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="./index.js"></script>
          </body>
          </html>
          HTMLEOF

      - name: Create root index.html
        run: |
          cat > dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>服务商工作台 2.0</title>
          </head>
          <body>
            <script>window.location.href='sp2-workspace/'</script>
          </body>
          </html>
          HTMLEOF
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
